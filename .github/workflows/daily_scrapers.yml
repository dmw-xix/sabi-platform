name: Sabi Daily Scrapers

on:
  schedule:
    - cron: '0 7 * * *'    # Shazam + RSS + Kworb + TurnTable
    - cron: '0 9 * * *'    # Audiomack
    - cron: '0 11 * * *'   # YouTube + Kworb Artist
    - cron: '0 13 * * *'   # Breakout detector (after all data is fresh)
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  shazam_charts:
    name: Shazam Nigeria Charts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Shazam scraper
        run: python scrapers/charts/shazam_scraper.py

  rss_feeds:
    name: RSS Press Feeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run RSS scraper
        run: python scrapers/charts/rss_scraper.py

  audiomack_snapshots:
    name: Audiomack Artist Snapshots
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run Audiomack scraper
        run: python scrapers/streaming/audiomack_scraper.py

  youtube_snapshots:
    name: YouTube Artist Snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run YouTube scraper
        run: python scrapers/streaming/youtube_scraper.py

          turntable_charts:
    name: TurnTable Nigeria Charts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run TurnTable scraper
        run: python scrapers/charts/turntable_scraper.py

        kworb_charts:
    name: Kworb Multi-Platform Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Kworb charts scraper
        run: python scrapers/streaming/kworb_scraper.py

  kworb_artist_global:
    name: Kworb Artist Global Presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Kworb artist scraper
        run: python scrapers/streaming/kworb_artist_scraper.py

  breakout_detector:
    name: Breakout Detection Engine
    runs-on: ubuntu-latest
    needs:
      - shazam_charts
      - kworb_charts
      - audiomack_snapshots
      - youtube_snapshots
      - rss_feeds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run breakout detector
        run: python intelligence/trend_velocity/breakout_detector.py